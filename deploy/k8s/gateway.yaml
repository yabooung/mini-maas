apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never drop below desired capacity
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: mini-maas/gateway:dev        # kind load docker-image mini-maas/gateway:dev --name mmaas
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000, name: http }]
          volumeMounts:
            - { name: config, mountPath: /app/gateway.yaml, subPath: gateway.yaml, readOnly: true }
            - { name: data, mountPath: /app/data }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }   # let endpoints propagate before SIGTERM
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: gateway-config }
        - name: data
          emptyDir: {}
# NOTE: keys/usage live in an emptyDir per pod for this demo. For a real deployment mount a
# PVC (single replica) or move the ledger to Postgres and the rate-limit buckets to Redis.
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ port: 8000, targetPort: http, nodePort: 30080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
