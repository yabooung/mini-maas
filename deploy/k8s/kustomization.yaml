apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mmaas
resources:
  - namespace.yaml
  - gateway.yaml
  - llama-small.yaml
  - llama-medium.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: gateway-config
    files: [gateway.yaml=gateway-config.yaml]
  - name: prometheus-config
    files: [prometheus.yml=prometheus.yml]
  - name: grafana-dashboards
    files: [mmaas.json=grafana/dashboards/mmaas.json]
  - name: grafana-provisioning
    files:
      - datasource.yaml=grafana/provisioning/datasources/datasource.yaml
      - dashboards.yaml=grafana/provisioning/dashboards/dashboards.yaml
generatorOptions:
  disableNameSuffixHash: true
