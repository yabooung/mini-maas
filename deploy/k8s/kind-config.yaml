# kind create cluster --name mmaas --config deploy/k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8000 }   # gateway
      - { containerPort: 30090, hostPort: 9090 }   # prometheus
      - { containerPort: 30030, hostPort: 3000 }   # grafana
