# kind create cluster --name mmaas --config deploy/k8s/kind-config.yaml
# Host ports are 18000/19090/13000 on 127.0.0.1 so they don't collide with common local services
# on 8000/9090/3000.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 18000, listenAddress: 127.0.0.1 }   # gateway
      - { containerPort: 30090, hostPort: 19090, listenAddress: 127.0.0.1 }   # prometheus
      - { containerPort: 30030, hostPort: 13000, listenAddress: 127.0.0.1 }   # grafana
