# Local stack: gateway + two llama.cpp backends (CPU) + Prometheus + Grafana.
#   docker compose up -d
#   docker compose exec gateway mmaas --config /app/gateway.yaml keys create --name dev
# Model files are pulled from Hugging Face on first start into the `models` volume.
# GGUF file names follow the official Qwen2.5 GGUF repos; adjust MODEL_* if they change.
#
# Host ports bind to 127.0.0.1 by default (Grafana here runs with admin/admin + anonymous viewing).
# Override per port if something already listens there, e.g.  GRAFANA_PORT=3001 docker compose up -d
# or expose on all interfaces deliberately with BIND=0.0.0.0.

x-llama: &llama
  image: ghcr.io/ggml-org/llama.cpp:server
  restart: unless-stopped
  volumes: ["models:/models"]
  environment:
    LLAMA_ARG_HOST: 0.0.0.0
    LLAMA_ARG_PORT: "8080"
    LLAMA_ARG_N_PARALLEL: "4"       # continuous batching slots
    LLAMA_ARG_CTX_SIZE: "16384"     # total KV across slots (4096 per slot)
    LLAMA_ARG_ENDPOINT_METRICS: "1" # /metrics for Prometheus
    HF_HUB_CACHE: /models

services:
  llama-small:
    <<: *llama
    command: ["--hf-repo", "${MODEL_SMALL_REPO:-Qwen/Qwen2.5-0.5B-Instruct-GGUF}",
              "--hf-file", "${MODEL_SMALL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}",
              "--alias", "qwen2.5-0.5b"]
    ports: ["${BIND:-127.0.0.1}:${LLAMA_SMALL_PORT:-8081}:8080"]

  llama-medium:
    <<: *llama
    command: ["--hf-repo", "${MODEL_MEDIUM_REPO:-Qwen/Qwen2.5-1.5B-Instruct-GGUF}",
              "--hf-file", "${MODEL_MEDIUM_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}",
              "--alias", "qwen2.5-1.5b"]
    ports: ["${BIND:-127.0.0.1}:${LLAMA_MEDIUM_PORT:-8082}:8080"]

  gateway:
    build: .
    restart: unless-stopped
    ports: ["${BIND:-127.0.0.1}:${GATEWAY_PORT:-8000}:8000"]
    volumes:
      - ./deploy/compose/gateway.yaml:/app/gateway.yaml:ro
      - gwdata:/app/data
    depends_on: [llama-small, llama-medium]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes: ["./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["${BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./deploy/k8s/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/k8s/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"]

volumes:
  models:
  gwdata:
