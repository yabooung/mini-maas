name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev] ruff
      - name: lint
        run: ruff check gateway tests bench --select E,F,W --line-length 120
      - name: unit tests (fake upstream, no models)
        run: pytest -q
      - name: kustomize build
        run: |
          curl -sLo kubectl "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && ./kubectl kustomize deploy/k8s > /tmp/k8s.yaml
          grep -c '^kind:' /tmp/k8s.yaml

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (load locally for smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mini-maas/gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: container smoke — boots, /healthz 200, /v1/models 200 without a key, /metrics exposed
        run: |
          docker run -d --name gw -p 8000:8000 -v "$PWD/gateway.example.yaml:/app/gateway.yaml:ro" mini-maas/gateway:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS localhost:8000/v1/models
          curl -fsS localhost:8000/metrics | grep -q mmaas_backend_healthy
          docker logs gw | tail -5
      - name: login GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push ghcr.io/${{ github.repository }}:sha + latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
